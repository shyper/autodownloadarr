<div id="poster-overview" aria-label="AutoDownloadarr Posterübersicht">
<header><strong class="brand"><b>↓</b> AutoDownloadarr</strong><nav aria-label="Hauptnavigation"><strong>Übersicht</strong><span>Filme</span><span>Serien</span><span>Downloads</span><span>Einstellungen</span></nav></header>
<main><label class="search"><i data-lucide="search" aria-hidden="true"></i><input type="search" placeholder="Filme und Serien entdecken …" aria-label="Filme und Serien suchen"></label><section data-row="added" aria-label="Zuletzt heruntergeladen"></section><section data-row="requested" aria-label="Zuletzt angefragt"></section><section data-row="trending" aria-label="Aktuell beliebt"></section><section class="detail" aria-live="polite" hidden></section><p class="empty" aria-live="polite" hidden>Keine passenden Titel gefunden.</p><footer><span>● Alle Dienste verbunden</span><span>Designvorschau · Beispieldaten · stilisierte Poster</span></footer></main>
</div>
<style>
#poster-overview{--po-bg:light-dark(#f5f6f8,#101522);--po-panel:light-dark(#fff,#1a2232);--po-fg:light-dark(#182234,#eef2fa);--po-dim:light-dark(#58657a,#9ba8bd);--po-line:light-dark(#dfe5ed,#2b3548);--po-accent:light-dark(#087b96,#63d9e8);--po-soft:light-dark(#e0f4f7,#15343e);font:14px/1.5 system-ui,sans-serif;background:var(--po-bg);color:var(--po-fg);border-radius:12px;overflow:hidden}
#poster-overview *{box-sizing:border-box}#poster-overview [hidden]{display:none!important}#poster-overview button,#poster-overview input{font:inherit}#poster-overview button:focus-visible,#poster-overview input:focus-visible{outline:3px solid var(--po-accent);outline-offset:3px}
#poster-overview header{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:20px 105px 20px 25px;background:var(--po-panel);border-bottom:1px solid var(--po-line)}
#poster-overview .brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650;letter-spacing:-.5px}#poster-overview .brand b{display:grid;place-items:center;width:28px;height:28px;background:var(--po-accent);color:var(--po-bg);border-radius:8px;font-size:22px}
#poster-overview nav{display:flex;align-items:center;gap:20px;color:var(--po-dim);font-size:12px;flex-wrap:wrap}#poster-overview nav strong{color:var(--po-accent);background:var(--po-soft);padding:6px 9px;border-radius:6px;font-weight:500}
#poster-overview main{padding:22px 25px 25px;display:grid;gap:28px}#poster-overview .search{display:flex;align-items:center;gap:10px;background:var(--po-panel);border:1px solid var(--po-line);border-radius:22px;padding:9px 15px;color:var(--po-dim)}#poster-overview .search input{width:100%;min-width:0;background:transparent;color:var(--po-fg);border:0;font-size:12px}#poster-overview input::placeholder{color:var(--po-dim)}
#poster-overview h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.5px}#poster-overview .heading{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:13px}#poster-overview .heading-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}#poster-overview .caption{color:var(--po-dim);font-size:11px}#poster-overview .arrows{display:flex;gap:5px;flex-shrink:0}#poster-overview .arrow{display:grid;place-items:center;border:1px solid var(--po-line);border-radius:50%;background:transparent;color:var(--po-fg);width:27px;height:27px;font-size:18px;padding:0}#poster-overview .arrow:disabled{opacity:.3}
#poster-overview .posters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}#poster-overview .poster{border:1px solid #ffffff1c;border-radius:9px;position:relative;overflow:hidden;isolation:isolate;aspect-ratio:2/3;padding:0;text-align:left;background:#192937;color:#fff;min-width:0;box-shadow:0 4px 10px #0002;transition:transform .15s}#poster-overview .poster:hover{transform:translateY(-3px)}
#poster-overview .art{position:absolute;inset:0;overflow:hidden;isolation:isolate}#poster-overview .art:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,#05101b35 55%,#05101bed)}#poster-overview .art:before{content:"";position:absolute;left:34%;top:28%;width:32%;height:46%;background:linear-gradient(#07131c66,#07131ce8);border-radius:42% 42% 8% 8%;transform:rotate(-9deg)}
#poster-overview .film-title{position:absolute;left:7px;right:7px;bottom:26px;z-index:1;color:#fff;font:500 clamp(13px,1.6vw,21px)/1.1 Georgia,serif;letter-spacing:.5px;text-align:center;text-shadow:0 2px 10px #0009;overflow-wrap:anywhere}#poster-overview .year{display:block;font:10px/1.5 system-ui,sans-serif;letter-spacing:3px;margin-bottom:7px;color:#ffffffc9}
#poster-overview .type{position:absolute;top:8px;left:7px;background:#1764a9e8;color:#f0f8ff;border-radius:5px;padding:2px 6px;font-size:10px;z-index:2;text-transform:uppercase;letter-spacing:.3px}#poster-overview .type.series{background:#7543b9e8}#poster-overview .check{position:absolute;top:8px;right:7px;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:#a0edc7;color:#075437;box-shadow:0 1px 6px #0006;z-index:2;font-size:13px;font-weight:650}
#poster-overview .watchable{position:absolute;top:8px;right:7px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:#164b5e;color:#a0eff7;box-shadow:0 1px 6px #0006;z-index:2}#poster-overview .watchable i{font-style:normal;font-size:15px}#poster-overview .watchable i:empty:before{content:"👁"}#poster-overview .watchable svg{width:15px;height:15px}
#poster-overview .badge{position:absolute;left:8px;bottom:42px;font-size:10px;line-height:1.4;font-weight:600;padding:3px 7px;border-radius:5px;background:#164b5e;color:#a0eff7;z-index:3}#poster-overview .pending .art{filter:grayscale(1);opacity:.72}#poster-overview .pending .badge{background:#e7c573;color:#483407}#poster-overview .active .film-title,#poster-overview .pending .film-title{bottom:83px}
#poster-overview .progress-area{position:absolute;left:0;right:0;bottom:0;padding:7px 8px 10px;background:linear-gradient(transparent,#07101ded 25%);z-index:2}#poster-overview .progress-info{font-size:10px;color:#e7f4ff;display:flex;justify-content:space-between;gap:4px;margin-bottom:6px}#poster-overview .track{height:4px;background:#c2dae52e;border-radius:4px;overflow:hidden;display:block}#poster-overview .fill{display:block;height:100%;background:#6ce1ef;border-radius:4px}#poster-overview .pending .track{background:#d2d7df47}
#poster-overview .note{position:absolute;bottom:8px;left:6px;right:6px;text-align:center;font-size:10px;color:#e7edf6bd;z-index:2}#poster-overview .requested-icon{position:absolute;top:8px;right:7px;display:grid;place-items:center;width:19px;height:19px;background:#594293;color:#e8dcff;border-radius:50%;font-size:12px;z-index:2}
#poster-overview .detail{background:var(--po-panel);border:1px solid var(--po-line);border-radius:10px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#poster-overview .detail h3{margin:0 0 4px;font-size:18px}#poster-overview .detail p{margin:0;color:var(--po-dim);font-size:12px}#poster-overview .actions{display:flex;gap:8px}#poster-overview .action{border:1px solid var(--po-line);border-radius:6px;padding:7px 10px;background:var(--po-bg);color:var(--po-fg);font-size:12px}#poster-overview .primary{background:var(--po-accent);color:var(--po-bg);border-color:transparent}#poster-overview .empty{color:var(--po-dim);padding:30px;text-align:center}#poster-overview footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--po-dim);border-top:1px solid var(--po-line);padding-top:15px}#poster-overview footer span:first-child{color:light-dark(#08734c,#78c6ac)}#poster-overview svg{width:16px;height:16px}
#poster-overview .art-dune{background:radial-gradient(ellipse at 70% 15%,#ffd69b 0,transparent 40%),linear-gradient(155deg,transparent 45%,#a45832 46%,#cc9453 68%,#5f3430 69%),#ba8959}#poster-overview .art-arrival{background:radial-gradient(ellipse at 58% 32%,#171d24 0 15%,transparent 16%),linear-gradient(transparent 55%,#afbcb333 56%,#43585c 90%),#869d9b}#poster-overview .art-batman{background:radial-gradient(ellipse at 62% 20%,#f69438 0,transparent 35%),linear-gradient(125deg,#a52e26,#4c1b22 65%,#172031)}#poster-overview .art-interstellar{background:radial-gradient(ellipse at 57% 29%,#172833 0 15%,#e5e1be 16%,#94a9aa 18%,transparent 23%),linear-gradient(145deg,#8ca5b3,#283c55 70%)}#poster-overview .art-blade{background:radial-gradient(circle at 70% 25%,#fca93e 0,transparent 45%),linear-gradient(145deg,#8f5448,#b65b35 40%,#44293b)}#poster-overview .art-oppenheimer{background:radial-gradient(ellipse at 55% 26%,#f8cd78 0,#c7622e 23%,#532a24 50%,#201f2b)}#poster-overview .art-severance{background:repeating-linear-gradient(90deg,transparent 0 24px,#c2ddd033 25px 27px),linear-gradient(145deg,#bdd4c5,#315c58 75%)}#poster-overview .art-shogun{background:radial-gradient(circle at 62% 25%,#a74136 0 22%,transparent 22.5%),linear-gradient(155deg,transparent 50%,#3e5145 51%,#1b302b 75%),#b8bea1}#poster-overview .art-silo{background:repeating-radial-gradient(ellipse at 65% 20%,#9b9a7c 0 6px,#474f45 7px 10px,#1f302f 11px 28px)}#poster-overview .art-bear{background:repeating-linear-gradient(0deg,transparent 0 28px,#48637766 29px 30px),linear-gradient(145deg,#95a6b4,#314c63 50%,#102531)}#poster-overview .art-andor{background:linear-gradient(35deg,transparent 45%,#672b28 46%,transparent 49%),radial-gradient(ellipse at 55% 27%,#d9af79,#435e67 38%,#1d3544 75%)}#poster-overview .art-project{background:radial-gradient(circle at 70% 25%,#cbd677 0 10%,transparent 11%),radial-gradient(ellipse at 25% 55%,#4c8b79,transparent 50%),#122d35}
@media(max-width:760px){#poster-overview header{gap:16px;padding:17px 95px 17px 18px}#poster-overview nav{gap:13px}#poster-overview main{padding:20px 18px;gap:25px}#poster-overview .posters{grid-template-columns:repeat(3,minmax(0,1fr))}#poster-overview .film-title{font-size:22px}}
@media(max-width:420px){#poster-overview .posters{grid-template-columns:repeat(2,minmax(0,1fr))}#poster-overview main{padding:18px 14px}#poster-overview header{padding-left:14px}#poster-overview nav{gap:12px;font-size:11px}#poster-overview h2{font-size:18px}#poster-overview .caption{display:none}#poster-overview .search input{font-size:16px}#poster-overview .film-title{font-size:19px}}
@media(pointer:coarse){#poster-overview .arrow{width:44px;height:44px}#poster-overview .action{min-height:44px}}@media(prefers-reduced-motion:reduce){#poster-overview .poster{transition:none}}
</style>
<script>
(() => {
const root=document.getElementById('poster-overview');
const films=[
{id:'dune',title:'Dune: Part Two',cover:'DUNE',year:2024,state:'active',playable:true,progress:68,eta:'4 Min.',kind:'Film',requested:8,finished:0},
{id:'batman',title:'The Batman',cover:'THE BATMAN',year:2022,state:'active',progress:24,eta:'12 Min.',kind:'Film',requested:7,finished:0},
{id:'arrival',title:'Arrival',cover:'ARRIVAL',year:2016,state:'pending',progress:0,kind:'Film',requested:6,finished:0},
{id:'blade',title:'Blade Runner 2049',cover:'BLADE RUNNER<br>2049',year:2017,state:'pending',progress:0,kind:'Film',requested:5,finished:0},
{id:'interstellar',title:'Interstellar',cover:'INTERSTELLAR',year:2014,state:'ready',kind:'Film',requested:4,finished:4,note:'Heute · 18:42'},
{id:'oppenheimer',title:'Oppenheimer',cover:'OPPENHEIMER',year:2023,state:'ready',kind:'Film',requested:3,finished:3,note:'Heute · 16:10'},
{id:'shogun',title:'Shōgun',cover:'SHŌGUN',year:2024,state:'ready',kind:'Serie',requested:2,finished:2,note:'Gestern · 22:18'},
{id:'severance',title:'Severance',cover:'SEVERANCE',year:2022,state:'requested',kind:'Serie',requested:10,finished:0},
{id:'silo',title:'Silo',cover:'SILO',year:2023,state:'requested',kind:'Serie',requested:9,finished:0},
{id:'bear',title:'The Bear',cover:'THE BEAR',year:2022,state:'new',kind:'Serie',requested:0,finished:0},
{id:'andor',title:'Andor',cover:'ANDOR',year:2022,state:'new',kind:'Serie',requested:0,finished:0},
{id:'project',title:'Project Hail Mary',cover:'PROJECT<br>HAIL MARY',year:2026,state:'new',kind:'Film',requested:0,finished:0}];
const translations={
  en:{downloaded:'Recently Downloaded',requested:'Recently Requested',trending:'Trending',downloading:'Downloading',pending:'Pending'},
  de:{downloaded:'Zuletzt heruntergeladen',requested:'Zuletzt angefragt',trending:'Aktuell beliebt',downloading:'Lädt',pending:'Ausstehend'}
};
const text=translations.de;
const shelves=[{id:'added',title:text.downloaded,caption:'2 laden · 2 in der Warteschlange',page:0},{id:'requested',title:text.requested,caption:'',page:0},{id:'trending',title:text.trending,caption:'Diese Woche',page:0}];
const saved=window.openai?.widgetState?.privateContent;
const state={query:typeof saved?.query==='string'?saved.query:'',timestamps:true};
const search=root.querySelector('input');search.value=state.query;
const detail=root.querySelector('.detail');
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=m=>m.state==='active'?`Lädt · ${m.progress} % · noch ${m.eta}${m.playable?' · bereits anschaubar':''}`:m.state==='pending'?'Ausstehend · in der Download-Warteschlange':m.state==='ready'?'Verfügbar':m.state==='requested'?'Angefragt':'Noch nicht angefragt';
function poster(m,shelf){const progress=m.state==='active'||m.state==='pending';return `<button type="button" class="poster ${m.state} cursor-interaction" data-film="${m.id}" aria-label="${escape(m.title)} · ${label(m)}"><span class="art art-${m.id}"><span class="film-title"><span class="year">${m.year}</span>${m.cover}</span></span><span class="type ${m.kind==='Serie'?'series':''}">${m.kind}</span>${m.state==='ready'?'<span class="check" data-tooltip="Verfügbar" aria-hidden="true">✓</span>':shelf==='added'&&m.state==='active'&&m.playable?'<span class="watchable" data-tooltip="Bereits anschaubar · Download läuft" aria-hidden="true"><i data-lucide="eye" aria-hidden="true"></i></span>':m.state==='requested'?'<span class="requested-icon" data-tooltip="Angefragt" aria-hidden="true">◷</span>':''}${progress?`<span class="badge">${m.state==='active'?'↓ '+text.downloading:'◷ '+text.pending}</span><span class="progress-area"><span class="progress-info"><span>${m.state==='active'?`${m.progress} %`:'Warteschlange'}</span><span>${m.state==='active'?m.eta:'0 %'}</span></span><span class="track" role="progressbar" aria-label="Download ${escape(m.title)}" aria-valuenow="${m.progress}" aria-valuemin="0" aria-valuemax="100"><span class="fill" style="width:${m.progress}%"></span></span></span>`:m.state==='ready'&&state.timestamps&&shelf==='added'?`<span class="note">${m.note}</span>`:''}</button>`;}
function items(id){let list;if(id==='added'){const rank={active:0,pending:1,ready:2};list=films.filter(m=>m.state in rank).sort((a,b)=>rank[a.state]-rank[b.state]||b.finished-a.finished||b.requested-a.requested);}else if(id==='requested')list=films.filter(m=>m.requested>0).sort((a,b)=>b.requested-a.requested);else list=['project','severance','dune','andor','bear','silo','shogun','batman','arrival'].map(id=>films.find(m=>m.id===id));return list.filter(m=>m.title.toLowerCase().includes(state.query.toLowerCase()));}
function render(){let total=0;shelves.forEach(s=>{const list=items(s.id);total+=list.length;const pages=Math.max(1,Math.ceil(list.length/6));s.page=Math.min(s.page,pages-1);const section=root.querySelector(`[data-row="${s.id}"]`);section.hidden=!list.length;section.innerHTML=`<div class="heading"><div class="heading-left"><h2>${s.title}</h2><span class="caption">${s.caption}</span></div><div class="arrows"><button type="button" class="arrow cursor-interaction" data-step="-1" data-shelf="${s.id}" aria-label="${s.title}: vorherige Poster" ${s.page===0?'disabled':''}>‹</button><button type="button" class="arrow cursor-interaction" data-step="1" data-shelf="${s.id}" aria-label="${s.title}: weitere Poster" ${s.page>=pages-1?'disabled':''}>›</button></div></div><div class="posters">${list.slice(s.page*6,s.page*6+6).map(m=>poster(m,s.id)).join('')}</div>`;});root.querySelector('.empty').hidden=total>0;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}
function persist(){window.openai?.setWidgetState?.({modelContent:{mockup:'Posterreihen',order:'Zuletzt heruntergeladen: aktive Downloads, Warteschlange, fertige Downloads absteigend nach Abschluss',selection:detail.hidden?null:detail.dataset.film},privateContent:{query:state.query}})?.catch(()=>{});}
search.addEventListener('input',()=>{state.query=search.value;shelves.forEach(s=>s.page=0);detail.hidden=true;render();persist();});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.step){shelves.find(s=>s.id===b.dataset.shelf).page+=Number(b.dataset.step);render();}if(b.dataset.film){const m=films.find(m=>m.id===b.dataset.film);detail.dataset.film=m.id;detail.hidden=false;detail.innerHTML=`<div><h3>${escape(m.title)}</h3><p>${m.year} · ${m.kind} · ${label(m)}</p></div><div class="actions">${m.state==='new'?'<button type="button" class="action primary cursor-interaction" data-request>Anfragen</button>':''}<button type="button" class="action cursor-interaction" data-close>Schließen</button></div>`;detail.scrollIntoView({block:'nearest',behavior:'auto'});persist();}if(b.hasAttribute('data-close')){detail.hidden=true;persist();}if(b.hasAttribute('data-request')){const m=films.find(m=>m.id===detail.dataset.film);m.state='requested';m.requested=11;render();detail.querySelector('p').textContent=`${m.year} · ${m.kind} · Angefragt (Vorschau)`;b.remove();persist();}});
window.addEventListener('openai:set_globals',e=>{const query=e.detail?.globals?.widgetState?.privateContent?.query;if(typeof query==='string'){state.query=query;search.value=query;render();}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'timestamps',{label:'Download-Abschluss auf fertigen Postern anzeigen'});}
})();
</script>
